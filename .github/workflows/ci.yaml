name: CI
on:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install StyLua v2.5.2
        run: |
          curl -fsSL -o /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -q /tmp/stylua.zip -d /tmp/stylua
          chmod +x /tmp/stylua/stylua
          echo "/tmp/stylua" >> "$GITHUB_PATH"
      - name: Check formatting
        run: stylua --check --config-path=stylua.toml lua/

  tests:
    name: Tests (latest stable Neovim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install latest stable Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          mkdir -p /tmp/nvim
          tar -xzf /tmp/nvim.tar.gz -C /tmp/nvim --strip-components=1
          echo "/tmp/nvim/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          test -d tests || { echo "::error::tests directory is missing"; exit 1; }
          test -f tests/minimal_init.lua || { echo "::error::tests/minimal_init.lua is missing"; exit 1; }
          nvim --version
          nvim --headless -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"
